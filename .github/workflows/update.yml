name: update

on:
  schedule:
    # GitHub Actionsのスケジューラーは高負荷時に発火をスキップすることがある
    # (既存2サイトで実測)。取りこぼしを減らすため2本立てにする。
    # Apple公式サイトへのリクエストは1回の実行で7件だけなので負荷は軽い
    - cron: "12 * * * *"
    - cron: "42 * * * *"
  workflow_dispatch:
    inputs:
      force_category:
        description: "見逃した入荷を後追いで下書き化する(通常は空のまま)"
        required: false
        type: choice
        default: ""
        options: ["", "mac", "ipad", "iphone", "watch"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: 在庫を取得して差分を検知
        run: python3 scripts/fetch_refurb.py

      - name: サイトを生成
        run: python3 scripts/generate_site.py

      - name: コミットしてプッシュ
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git add -A
          # 状態ファイルにコンフリクトマーカーが混入したままコミットされる
          # 事故が既存サイトで起きているため、push前に必ず確認する
          if git grep -qE '^(<<<<<<<|>>>>>>>)' -- data/ docs/; then
            echo "::error::コンフリクトマーカーを検出したため中止します"
            exit 1
          fi
          git commit -m "在庫情報を更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          # 2本のcronが接近して走った場合に備えてリベースしてから押す
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # WordPress側の障害やAPIの不調でも在庫の取得・公開自体は止めたく
      # ないため、この投稿ステップは上のコミット・pushより後に置く。
      # スクリプト自体も失敗時は終了コード0で抜ける設計だが、想定外の
      # 例外に備えてcontinue-on-errorも重ねておく
      - name: 新規入荷をネタフルの下書きに投稿
        continue-on-error: true
        env:
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_CATEGORY: ${{ inputs.force_category }}
        run: python3 scripts/post_to_wordpress.py
