name: update

on:
  # 定期実行は GitHub の schedule をやめ、Google Cloud Scheduler から
  # workflow_dispatch API を叩く方式に移行した (2026-08-29)。
  #
  # 元々「cronを2本立てにして取りこぼしを減らす」対策を入れていたが、
  # 2026-08-25〜29 の実測では公称30分に対し最長12.3時間の欠測があり、
  # 2本立てでは足りていなかった。しかも家電/電書ポチと同時刻に同じ穴が
  # 空いており、GitHub側が発火を間引いているのが原因と確定している
  # (ワークフロー自体の失敗は0件)。workflow_dispatch はこの間引きの対象外。
  #
  # 発火元: Cloud Scheduler ジョブ ringo-pochi-update
  #         (GCPプロジェクト manga-rss / asia-northeast1 / cron "12,42 * * * *" UTC)
  #
  # **間隔を変えたら config.json の文言も必ず直すこと。**
  # サイトのヘッダーと「〜について」セクションに更新頻度を書いており
  # （config.json の site_description と about）、cronだけ変えると表示が
  # 嘘になる。実際2026-08時点で、3サイトとも「1時間ごと」と表示しながら
  # 実態は家電2時間・電書6時間・林檎30分とすべて食い違っていた。
  # 30分間隔は従来どおり。このサイトは Amazon Creators API を使わず
  # Apple公式サイトへのリクエストが1回7件だけと軽いため、家電/電書ポチの
  # ようなAPIクォータ由来の間隔調整は不要。
  # ※ schedule を消したので、間隔を変えたいときはこのファイルではなく
  #   Cloud Scheduler 側のジョブを直すこと。
  workflow_dispatch:
    inputs:
      force_category:
        description: "見逃した入荷を後追いで下書き化する(通常は空のまま)"
        required: false
        type: choice
        default: ""
        options: ["", "mac", "ipad", "iphone", "watch"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: 在庫を取得して差分を検知
        run: python3 scripts/fetch_refurb.py

      - name: サイトを生成
        run: python3 scripts/generate_site.py

      - name: コミットしてプッシュ
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git add -A
          # 状態ファイルにコンフリクトマーカーが混入したままコミットされる
          # 事故が既存サイトで起きているため、push前に必ず確認する
          if git grep -qE '^(<<<<<<<|>>>>>>>)' -- data/ docs/; then
            echo "::error::コンフリクトマーカーを検出したため中止します"
            exit 1
          fi
          git commit -m "在庫情報を更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          # 2本のcronが接近して走った場合に備えてリベースしてから押す
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # WordPress側の障害やAPIの不調でも在庫の取得・公開自体は止めたく
      # ないため、この投稿ステップは上のコミット・pushより後に置く。
      # スクリプト自体も失敗時は終了コード0で抜ける設計だが、想定外の
      # 例外に備えてcontinue-on-errorも重ねておく
      - name: 新規入荷をネタフルの下書きに投稿
        continue-on-error: true
        env:
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_CATEGORY: ${{ inputs.force_category }}
        run: python3 scripts/post_to_wordpress.py
